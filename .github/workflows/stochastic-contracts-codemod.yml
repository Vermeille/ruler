name: One-shot stochastic contract fixes

on:
  push:
    branches: [archetypes]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archetypes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: python scripts/fix-stochastic-contracts.py
      - run: python scripts/fix-stochastic-contracts-typing.py
      - run: npm run build
      - run: npx tsx --test tests/rules.test.ts tests/rule-analysis.test.ts
      - name: Commit validated fixes
        run: |
          rm scripts/fix-stochastic-contracts.py scripts/fix-stochastic-contracts-typing.py .github/workflows/stochastic-contracts-codemod.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Align stochastic tests and causal analysis"
          git push origin HEAD:archetypes
