name: Sports scenario probe

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx tsx --test --test-name-pattern="sports subsidy reallocates real workers" tests/scenarios.test.ts
