name: One-shot trusted population fast path

on:
  pull_request:
    paths:
      - '.github/workflows/perf-codemod.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Apply trusted population fast path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/sim/population/settlement.ts')
          text = path.read_text()

          old_sig = """function validatePopulationEffect(\n  snapshot: DeepReadonly<Model>,\n  effect: PopulationEffect,\n  groups: Map<number, GroupLocation>,\n): void {\n"""
          new_sig = """function validatePopulationEffect(\n  snapshot: DeepReadonly<Model>,\n  effect: PopulationEffect,\n  groups: Map<number, GroupLocation>,\n  strictShape: boolean,\n): void {\n"""
          if new_sig not in text:
              if old_sig not in text:
                  raise SystemExit('validatePopulationEffect signature changed')
              text = text.replace(old_sig, new_sig, 1)

          text = text.replace(
              """  } else if (effect.kind === 'population-transition') {\n    let count = 0;\n""",
              """  } else if (effect.kind === 'population-transition' && strictShape) {\n    let count = 0;\n""",
              1,
          )
          text = text.replace(
              """  } else if (effect.kind === 'population-state') {\n    let count = 0;\n""",
              """  } else if (effect.kind === 'population-state' && strictShape) {\n    let count = 0;\n""",
              1,
          )

          old_plan = """  for (const effect of effects) {\n    validatePopulationEffect(snapshot, effect, groups);\n"""
          new_plan = """  const strictShape = Object.isFrozen(snapshot);\n  for (const effect of effects) {\n    validatePopulationEffect(snapshot, effect, groups, strictShape);\n"""
          if new_plan not in text:
              if old_plan not in text:
                  raise SystemExit('planPopulation validation loop changed')
              text = text.replace(old_plan, new_plan, 1)

          old_apply = """    if (field in source.attitudes) {\n      const key = field as keyof PopulationGroup['attitudes'];\n      target.attitudes[key] = clamp(source.attitudes[key] + delta);\n      continue;\n    }\n    const key = field as keyof Pick<PopulationGroup, 'age' | 'education' | 'income' | 'wealth' | 'health' | 'wellbeing' | 'approval'>;\n    const value = source[key] + delta;\n    target[key] = ['education', 'health', 'wellbeing', 'approval'].includes(field)\n      ? clamp(value) : Math.max(0, value);\n"""
          new_apply = """    if (field === 'environmentalism' || field === 'civicLiberty'\n      || field === 'traditionalism' || field === 'solidarity') {\n      const key = field as keyof PopulationGroup['attitudes'];\n      target.attitudes[key] = clamp(source.attitudes[key] + delta);\n      continue;\n    }\n    const key = field as keyof Pick<PopulationGroup, 'age' | 'education' | 'income' | 'wealth' | 'health' | 'wellbeing' | 'approval'>;\n    const value = source[key] + delta;\n    const bounded = field === 'education' || field === 'health' || field === 'wellbeing' || field === 'approval';\n    target[key] = bounded ? clamp(value) : Math.max(0, value);\n"""
          if new_apply not in text:
              if old_apply not in text:
                  raise SystemExit('applyGroupChange hot loop changed')
              text = text.replace(old_apply, new_apply, 1)

          path.write_text(text)
          PY
      - run: npm run build
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/sim/population/settlement.ts
          git commit -m "Fast-path trusted population effect settlement"
          git push origin HEAD:${{ github.head_ref }}
