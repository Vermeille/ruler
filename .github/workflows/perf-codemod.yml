name: One-shot mortality compaction optimization

on:
  pull_request:
    paths:
      - '.github/workflows/perf-codemod.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Avoid compaction after death-only effects
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/sim/engine.ts')
          text = path.read_text()
          old = """  for (const effect of populationEffects) {\n    if (effect.kind !== 'population-state') {\n      needsCompaction = true;\n      break;\n    }\n    const sourceCount = populationPlan.groups.get(effect.group)?.group.count ?? 0;\n"""
          new = """  for (const effect of populationEffects) {\n    if (effect.kind === 'population-delta' && effect.cause === 'death') continue;\n    if (effect.kind !== 'population-state') {\n      needsCompaction = true;\n      break;\n    }\n    const sourceCount = populationPlan.groups.get(effect.group)?.group.count ?? 0;\n"""
          if new in text:
              print('optimization already applied')
          elif old not in text:
              raise SystemExit('compaction block changed; refusing blind patch')
          else:
              path.write_text(text.replace(old, new, 1))
          PY
      - run: npx tsc --noEmit
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/sim/engine.ts
          git commit -m "Skip compaction after mortality-only changes"
          git push origin HEAD:${{ github.head_ref }}
