name: One-shot mortality compaction optimization

on:
  pull_request:
    paths:
      - '.github/workflows/perf-codemod.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Apply validated performance fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{path_name}: expected patch target not found')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'src/sim/engine.ts',
              """  for (const effect of populationEffects) {\n    if (effect.kind !== 'population-state') {\n      needsCompaction = true;\n      break;\n    }\n    const sourceCount = populationPlan.groups.get(effect.group)?.group.count ?? 0;\n""",
              """  for (const effect of populationEffects) {\n    if (effect.kind === 'population-delta' && effect.cause === 'death') continue;\n    if (effect.kind !== 'population-state') {\n      needsCompaction = true;\n      break;\n    }\n    const sourceCount = populationPlan.groups.get(effect.group)?.group.count ?? 0;\n""",
          )
          replace_once(
              'src/sim/population/retraining.ts',
              '        let opportunity = SECTORS[0];',
              '        let opportunity: Sector = SECTORS[0];',
          )
          replace_once(
              'src/sim/population/settlement.ts',
              "function addBirth(model: Model, effect: Extract<PopulationEffect, { kind: 'population-delta'; cause: 'birth' }>, amount: number): number {",
              "function addBirth(model: Model, effect: Extract<PopulationEffect, { kind: 'population-delta' }>, amount: number): number {",
          )
          PY
      - run: npm run build
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/sim/engine.ts src/sim/population/retraining.ts src/sim/population/settlement.ts
          git commit -m "Reduce mortality settlement overhead"
          git push origin HEAD:${{ github.head_ref }}
