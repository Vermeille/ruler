name: Refactor map field registry

on:
  push:
    branches: [archetypes]

permissions:
  contents: write

concurrency:
  group: refactor-map-fields
  cancel-in-progress: true

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: node scripts/refactor-map-fields.mjs
      - name: Finish save validation registry wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/sim/save.ts')
          text = path.read_text()
          import_old = "import { isMutableMapxelField, validMapxelFieldValue } from './map-fields';"
          import_new = "import { MUTABLE_FIELDS, isMutableMapxelField, validMapxelFieldValue } from './map-fields';"
          if text.count(import_old) != 1:
              raise SystemExit('expected map field import not found exactly once')
          text = text.replace(import_old, import_new)
          block_old = """  for (const field of Object.keys(base) as (keyof Mapxel)[]) {\n    if (isMutableMapxelField(String(field))) {\n      if (!validMapxelFieldValue(field, saved[field], 1e-6)) return fail();\n    } else if (saved[field] !== base[field]) {\n      return fail();\n    }\n  }"""
          block_new = """  for (const field of Object.keys(base) as (keyof Mapxel)[]) {\n    const fieldName = String(field);\n    if (isMutableMapxelField(fieldName)) {\n      if (!validMapxelFieldValue(fieldName, saved[field], 1e-6)) return fail();\n    } else if (saved[field] !== base[field]) {\n      return fail();\n    }\n  }"""
          if text.count(block_old) != 1:
              raise SystemExit('expected validateCell block not found exactly once')
          path.write_text(text.replace(block_old, block_new))
          PY
      - run: npm test
      - run: npm run build
      - name: Commit validated refactor
        run: |
          rm scripts/refactor-map-fields.mjs .github/workflows/refactor-map-fields.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sim/map-fields.ts src/sim/types.ts src/sim/engine.ts src/sim/save.ts tests/map-fields.test.ts scripts/refactor-map-fields.mjs .github/workflows/refactor-map-fields.yml
          git commit -m "Centralize mapxel field mechanics"
          git push
