name: Behavior calibration probe

on:
  push:
    branches: [archetypes]

concurrency:
  group: behavior-probe-archetypes
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archetypes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx tsx scripts/behavior-probe.ts
