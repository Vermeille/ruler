name: One-shot population field registry refactor

on:
  push:
    branches: [archetypes]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archetypes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Make population settlement schema-driven
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{path_name}: expected patch target not found')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'src/sim/types.ts',
              """export type PopulationStateField = 'age' | 'education' | 'income' | 'wealth'\n  | 'health' | 'wellbeing' | 'approval'\n  | 'environmentalism' | 'civicLiberty' | 'traditionalism' | 'solidarity';\n""",
              """type NumericPopulationGroupField = {\n  [K in keyof PopulationGroup]: PopulationGroup[K] extends number ? K : never\n}[keyof PopulationGroup];\n\nexport type PopulationStateField =\n  | Exclude<NumericPopulationGroupField, 'id' | 'archetype' | 'count'>\n  | keyof PopulationGroup['attitudes'];\n\ntype PrimitivePopulationTransitionField = {\n  [K in keyof PopulationGroup]: PopulationGroup[K] extends string | boolean | null ? K : never\n}[keyof PopulationGroup];\n\nexport type PopulationTransitionField = PrimitivePopulationTransitionField;\n""",
          )
          replace_once(
              'src/sim/types.ts',
              "transition: Partial<Pick<PopulationGroup, 'lifeStage' | 'occupation' | 'employed'>>;",
              "transition: Partial<Pick<PopulationGroup, PopulationTransitionField>>;",
          )

          Path('src/sim/population/fields.ts').write_text("""import { clamp } from '../math';
import { SECTORS, type DeepReadonly, type PopulationGroup, type PopulationStateField, type PopulationTransitionField } from '../types';

export type PopulationStateFieldSpec = {
  storage: 'group' | 'attitudes';
  min?: number;
  max?: number;
};

export type PopulationTransitionFieldSpec = {
  valid(value: unknown): boolean;
};

/**
 * Mechanics for mutable scalar population state. Settlement depends on this metadata, never
 * on game-design concepts such as environmentalism or whatever we add next.
 * Exhaustiveness is intentional: adding a scalar field to PopulationGroup makes TypeScript
 * require its storage/bounds semantics here.
 */
export const POPULATION_STATE_FIELDS = {
  age: { storage: 'group', min: 0 },
  education: { storage: 'group', min: 0, max: 1 },
  income: { storage: 'group', min: 0 },
  wealth: { storage: 'group', min: 0 },
  health: { storage: 'group', min: 0, max: 1 },
  wellbeing: { storage: 'group', min: 0, max: 1 },
  approval: { storage: 'group', min: 0, max: 1 },
  environmentalism: { storage: 'attitudes', min: 0, max: 1 },
  civicLiberty: { storage: 'attitudes', min: 0, max: 1 },
  traditionalism: { storage: 'attitudes', min: 0, max: 1 },
  solidarity: { storage: 'attitudes', min: 0, max: 1 },
} as const satisfies Record<PopulationStateField, PopulationStateFieldSpec>;

export const POPULATION_TRANSITION_FIELDS = {
  lifeStage: { valid: (value: unknown) => value === 'child' || value === 'adult' || value === 'senior' },
  occupation: { valid: (value: unknown) => value === null || (typeof value === 'string' && (SECTORS as readonly string[]).includes(value)) },
  employed: { valid: (value: unknown) => typeof value === 'boolean' },
} satisfies Record<PopulationTransitionField, PopulationTransitionFieldSpec>;

export function populationStateFieldSpec(field: string): PopulationStateFieldSpec | undefined {
  return (POPULATION_STATE_FIELDS as Record<string, PopulationStateFieldSpec>)[field];
}

export function populationTransitionFieldSpec(field: string): PopulationTransitionFieldSpec | undefined {
  return (POPULATION_TRANSITION_FIELDS as Record<string, PopulationTransitionFieldSpec>)[field];
}

export function readPopulationStateField(
  group: DeepReadonly<PopulationGroup>,
  field: PopulationStateField,
): number {
  const spec = POPULATION_STATE_FIELDS[field];
  return spec.storage === 'attitudes'
    ? group.attitudes[field as keyof PopulationGroup['attitudes']]
    : Number(group[field as keyof PopulationGroup]);
}

function bounded(value: number, spec: PopulationStateFieldSpec): number {
  if (spec.min !== undefined && spec.max !== undefined) return clamp(value, spec.min, spec.max);
  if (spec.min !== undefined) return Math.max(spec.min, value);
  if (spec.max !== undefined) return Math.min(spec.max, value);
  return value;
}

export function applyPopulationStateDelta(
  target: PopulationGroup,
  source: DeepReadonly<PopulationGroup>,
  field: PopulationStateField,
  delta: number,
): void {
  const spec = POPULATION_STATE_FIELDS[field];
  const value = bounded(readPopulationStateField(source, field) + delta, spec);
  if (spec.storage === 'attitudes') {
    target.attitudes[field as keyof PopulationGroup['attitudes']] = value;
    return;
  }
  (target as unknown as Record<string, unknown>)[field] = value;
}

export function validPopulationStateValue(field: PopulationStateField, value: unknown): boolean {
  const spec = POPULATION_STATE_FIELDS[field];
  if (typeof value !== 'number' || !Number.isFinite(value)) return false;
  if (spec.min !== undefined && value < spec.min) return false;
  if (spec.max !== undefined && value > spec.max) return false;
  return true;
}
""")

          path = Path('src/sim/population/settlement.ts')
          text = path.read_text()
          text = text.replace("import { clamp } from '../math';\n", '')
          import_anchor = "import { ARCHETYPE_COUNT } from './archetypes';\n"
          registry_import = "import {\n  applyPopulationStateDelta,\n  POPULATION_STATE_FIELDS,\n  POPULATION_TRANSITION_FIELDS,\n  populationStateFieldSpec,\n  populationTransitionFieldSpec,\n  validPopulationStateValue,\n} from './fields';\n"
          if registry_import not in text:
              if import_anchor not in text:
                  raise SystemExit('settlement import anchor changed')
              text = text.replace(import_anchor, import_anchor + registry_import, 1)

          old_transition = """  } else if (effect.kind === 'population-transition' && strictShape) {\n    let count = 0;\n    for (const key in effect.transition) {\n      count += 1;\n      const value = effect.transition[key as keyof typeof effect.transition];\n      if (!['lifeStage', 'occupation', 'employed'].includes(key)\n        || (key === 'lifeStage' && !['child', 'adult', 'senior'].includes(String(value)))\n        || (key === 'occupation' && ![null, 'agriculture', 'manufacturing', 'services', 'sports'].includes(value as string | null))\n        || (key === 'employed' && typeof value !== 'boolean')) {\n        throw new Error('Invalid population transition.');\n      }\n    }\n    if (count === 0) throw new Error('Invalid population transition.');\n  } else if (effect.kind === 'population-state' && strictShape) {\n    let count = 0;\n    for (const key in effect.change) {\n      count += 1;\n      const value = effect.change[key as keyof typeof effect.change];\n      if (!['age', 'education', 'income', 'wealth', 'health', 'wellbeing', 'approval',\n        'environmentalism', 'civicLiberty', 'traditionalism', 'solidarity'].includes(key)\n        || !Number.isFinite(value)) {\n        throw new Error('Invalid population state change.');\n      }\n    }\n    if (count === 0) throw new Error('Invalid population state change.');\n"""
          new_transition = """  } else if (effect.kind === 'population-transition' && strictShape) {\n    let count = 0;\n    for (const key in effect.transition) {\n      count += 1;\n      const spec = populationTransitionFieldSpec(key);\n      const value = effect.transition[key as keyof typeof effect.transition];\n      if (!spec || !spec.valid(value)) throw new Error('Invalid population transition.');\n    }\n    if (count === 0) throw new Error('Invalid population transition.');\n  } else if (effect.kind === 'population-state' && strictShape) {\n    let count = 0;\n    for (const key in effect.change) {\n      count += 1;\n      const spec = populationStateFieldSpec(key);\n      const value = effect.change[key as keyof typeof effect.change];\n      if (!spec || typeof value !== 'number' || !Number.isFinite(value)) {\n        throw new Error('Invalid population state change.');\n      }\n    }\n    if (count === 0) throw new Error('Invalid population state change.');\n"""
          if old_transition not in text:
              raise SystemExit('settlement validation block changed')
          text = text.replace(old_transition, new_transition, 1)

          old_validate = """function validateGroupState(group: Omit<PopulationGroup, 'id' | 'archetype' | 'count'>): void {\n  if (!group || !group.attitudes) throw new Error('Invalid initial population state.');\n  const numbers = [group.age, group.education, group.income, group.wealth, group.health, group.wellbeing,\n    group.approval, ...Object.values(group.attitudes)];\n  if (numbers.some(value => !Number.isFinite(value) || value < 0)\n    || [group.education, group.health, group.wellbeing, group.approval,\n      ...Object.values(group.attitudes)].some(value => value > 1)\n    || !['child', 'adult', 'senior'].includes(group.lifeStage)\n    || (group.occupation !== null && !['agriculture', 'manufacturing', 'services', 'sports'].includes(group.occupation))\n    || typeof group.employed !== 'boolean') throw new Error('Invalid initial population state.');\n}\n"""
          new_validate = """function validateGroupState(group: Omit<PopulationGroup, 'id' | 'archetype' | 'count'>): void {\n  if (!group || !group.attitudes) throw new Error('Invalid initial population state.');\n  const raw = group as unknown as Record<string, unknown>;\n  const attitudes = group.attitudes as unknown as Record<string, unknown>;\n  for (const [field, spec] of Object.entries(POPULATION_STATE_FIELDS)) {\n    const value = spec.storage === 'attitudes' ? attitudes[field] : raw[field];\n    if (!validPopulationStateValue(field as keyof typeof POPULATION_STATE_FIELDS, value)) {\n      throw new Error('Invalid initial population state.');\n    }\n  }\n  for (const [field, spec] of Object.entries(POPULATION_TRANSITION_FIELDS)) {\n    if (!spec.valid(raw[field])) throw new Error('Invalid initial population state.');\n  }\n}\n"""
          if old_validate not in text:
              raise SystemExit('validateGroupState changed')
          text = text.replace(old_validate, new_validate, 1)

          old_apply = """  for (const field in effect.change) {\n    const delta = effect.change[field as keyof typeof effect.change];\n    if (delta === undefined) continue;\n    if (field === 'environmentalism' || field === 'civicLiberty'\n      || field === 'traditionalism' || field === 'solidarity') {\n      const key = field as keyof PopulationGroup['attitudes'];\n      target.attitudes[key] = clamp(source.attitudes[key] + delta);\n      continue;\n    }\n    const key = field as keyof Pick<PopulationGroup, 'age' | 'education' | 'income' | 'wealth' | 'health' | 'wellbeing' | 'approval'>;\n    const value = source[key] + delta;\n    const bounded = field === 'education' || field === 'health' || field === 'wellbeing' || field === 'approval';\n    target[key] = bounded ? clamp(value) : Math.max(0, value);\n  }\n"""
          new_apply = """  for (const field in effect.change) {\n    const delta = effect.change[field as keyof typeof effect.change];\n    if (delta === undefined) continue;\n    applyPopulationStateDelta(target, source, field as keyof typeof POPULATION_STATE_FIELDS, delta);\n  }\n"""
          if old_apply not in text:
              raise SystemExit('applyGroupChange changed')
          text = text.replace(old_apply, new_apply, 1)

          old_plan_sig = "export function planPopulation(snapshot: DeepReadonly<Model>, effects: readonly PopulationEffect[]): PopulationPlan {"
          new_plan_sig = "export function planPopulation(\n  snapshot: DeepReadonly<Model>,\n  effects: readonly PopulationEffect[],\n  options: { strictShape?: boolean } = {},\n): PopulationPlan {"
          if old_plan_sig not in text:
              raise SystemExit('planPopulation signature changed')
          text = text.replace(old_plan_sig, new_plan_sig, 1)
          text = text.replace('  const strictShape = Object.isFrozen(snapshot);', '  const strictShape = options.strictShape ?? true;', 1)
          path.write_text(text)

          path = Path('src/sim/engine.ts')
          text = path.read_text()
          import_anchor = "import { mergePopulation } from './population/merge';\n"
          field_import = "import { readPopulationStateField } from './population/fields';\n"
          if field_import not in text:
              if import_anchor not in text:
                  raise SystemExit('engine import anchor changed')
              text = text.replace(import_anchor, import_anchor + field_import, 1)

          old_read = """      const value = read.field in group.attitudes\n        ? group.attitudes[read.field as keyof typeof group.attitudes]\n        : Number(group[read.field as keyof typeof group]);\n"""
          new_read = """      const value = read.field === 'count' || read.field === 'employed'\n        ? Number(group[read.field])\n        : readPopulationStateField(group, read.field);\n"""
          if old_read not in text:
              raise SystemExit('recordCause population read changed')
          text = text.replace(old_read, new_read, 1)

          old_commit_sig = """export function commitEffects(\n  game: Game,\n  snapshot: DeepReadonly<Model>,\n  proposals: Proposal[],\n): void {\n"""
          new_commit_sig = """export function commitEffects(\n  game: Game,\n  snapshot: DeepReadonly<Model>,\n  proposals: Proposal[],\n  options: { strictPopulationShape?: boolean } = {},\n): void {\n"""
          if old_commit_sig not in text:
              raise SystemExit('commitEffects signature changed')
          text = text.replace(old_commit_sig, new_commit_sig, 1)

          old_plan_call = '  const populationPlan = planPopulation(snapshot, populationEffects);'
          new_plan_call = """  const populationPlan = planPopulation(snapshot, populationEffects, {\n    strictShape: options.strictPopulationShape ?? true,\n  });"""
          if old_plan_call not in text:
              raise SystemExit('population plan call changed')
          text = text.replace(old_plan_call, new_plan_call, 1)

          old_commit_call = '  commitEffects(game, snapshot, proposals);'
          new_commit_call = '  commitEffects(game, snapshot, proposals, { strictPopulationShape: !trusted });'
          if old_commit_call not in text:
              raise SystemExit('runPhase commit call changed')
          text = text.replace(old_commit_call, new_commit_call, 1)
          path.write_text(text)
          PY
      - run: npm run build
      - run: npm test -- --test-name-pattern='population|settlement|rule registration'
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/extensibility-codemod.yml
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make population settlement field-driven"
          git push origin HEAD:archetypes
