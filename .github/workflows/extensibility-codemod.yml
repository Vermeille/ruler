name: One-shot population field registry refactor

on:
  push:
    branches: [archetypes]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archetypes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: python scripts/refactor-population-fields.py
      - run: npm run build
      - run: npx tsx --test tests/population.test.ts tests/population-authority.test.ts tests/population-resolution.test.ts
      - name: Commit validated refactor
        run: |
          rm scripts/refactor-population-fields.py .github/workflows/extensibility-codemod.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make population settlement field-driven"
          git push origin HEAD:archetypes
