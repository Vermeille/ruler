name: Apply engine performance refactor

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'archetypes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archetypes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-engine-perf-refactor.mjs
      - name: Commit refactor if needed
        run: |
          if git diff --quiet -- src/sim/engine.ts; then
            echo "No engine changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sim/engine.ts
          git commit -m "Avoid full-model phase snapshots"
          git push origin HEAD:archetypes
